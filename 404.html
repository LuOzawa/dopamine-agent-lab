<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>页面已移动 · Dopamine Agent Lab</title>
<style>
  :root { --paper:#fbf9f3; --ink:#17212b; --muted:#5e6a74; --rule:#d8dde1; --brass:#a8874a; --brass-dark:#6f5522; --teal:#0f5a5a; --serif:"Songti SC","Noto Serif SC","STSong",Georgia,serif; --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.8; }
  .wrap { max-width:760px; margin:0 auto; padding:72px 24px; }
  .mark { width:34px; height:34px; display:grid; place-items:center; border:1px solid var(--brass); color:var(--brass-dark); font-family:var(--serif); font-size:16px; margin-bottom:32px; }
  h1 { font-family:var(--serif); font-size:clamp(30px,6vw,44px); line-height:1.3; margin:0 0 12px; }
  p { color:var(--muted); margin:0 0 18px; max-width:42em; }
  .links { display:flex; flex-wrap:wrap; gap:10px; margin-top:26px; }
  .links a { display:inline-block; padding:9px 16px; border:1px solid var(--rule); background:#fff; color:var(--ink); text-decoration:none; font-size:14px; }
  .links a:hover { border-color:var(--ink); background:#fffdf7; }
  .links a.primary { background:var(--ink); border-color:var(--ink); color:#fff; }
  .small { font-size:12px; color:var(--muted); margin-top:28px; }
  code { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:0.92em; background:#f1eee5; padding:1px 5px; }
  @media (max-width:520px) { .wrap { padding:48px 18px; } }
</style>
<script>
  (function () {
    var path = decodeURIComponent(location.pathname);
    var file = path.split('/').pop();
    var base = path.replace(/[^/]*$/, '');
    var pages = [
      'stage-1.html','stage-2.html','stage-3.html','stage-4.html',
      'stage-5.html','stage-6.html','stage-7.html','stage-8.html',
      'contents.html','frameworks.html','search.html','audit.html','about.html'
    ];
    if (pages.indexOf(file) !== -1) {
      location.replace(base + 'ai-agent/' + file + location.hash);
      return;
    }
    var dirs = ['assets','examples','tools'];
    for (var i = 0; i < dirs.length; i++) {
      var marker = '/' + dirs[i] + '/';
      if (path.indexOf(marker) !== -1 && path.indexOf('/ai-agent/' + dirs[i] + '/') === -1) {
        location.replace(path.replace(marker, '/ai-agent/' + dirs[i] + '/'));
        return;
      }
    }
  })();
</script>
</head>
<body>
  <div class="wrap">
    <div class="mark" aria-hidden="true">D</div>
    <h1>页面已移动到课程目录</h1>
    <p>主站已经整理为「一个落地页 + 两个课程目录」。旧链接会自动跳转；如果没有自动跳转，请从下面选择。</p>
    <div class="links">
      <a class="primary" href="ai-agent/index.html">AI Agent 学习站 →</a>
      <a href="deepseek-harness/index.html">DeepSeek Harness 手册 →</a>
      <a href="index.html">返回首页</a>
    </div>
    <p class="small">当前路径：<code id="path-info"></code></p>
  </div>
  <script>document.getElementById('path-info').textContent = location.pathname;</script>
</body>
</html>
